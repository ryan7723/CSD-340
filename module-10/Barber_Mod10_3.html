<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <title>CSD 340 Web Development with HTML and CSS</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #1b1b1b;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
            color: orange;
        }

        .image-container {
            margin: 40px;
        }

        img {
            width: 400px;
            height: 500px;
            object-fit: contain;
            border: 4px solid orange;
            background-color: black;
            cursor: pointer;
        }

        p {
            font-size: 20px;
        }

        a {
            color: cyan;
            font-size: 18px;
        }

    </style>

    <script>

        function transformGoku() {
            document.getElementById("goku").src = "gokusuper.jpg";

        }

        function transformPrime() {
            document.getElementById("prime").src = "primerobot.jpg";

        }

    </script>
</head>

<body>

    <h1>Assignment 10.3: JavaScript - Part 2</h1>

    <div class="image-container">

        <img id="goku"
             src="gokubase.jpg"
             alt="Goku Base Form"
             onclick="transformGoku()">

        <p>Click Goku so he can transform into a Super Saiyan!</p>

    </div>

    <div class="image-container">

        <img id="prime"
             src="primetruck.jpg"
             alt="Optimus Prime Truck"
             onclick="transformPrime()">

        <p>Click Optimus Prime so he can transform and roll out!</p>

    </div>

    <br>

    <a href="../index.html">Return to Landing Page</a>

</body>
</html>
